---
- name: <<< PLAYBOOK 24 >>> INSTALL | Install certificates on a Certifications Authority.
  hosts: cproca
  become: true
  become_user: "{{ cpca_srv_acc }}"
  tasks:
    - name: INSTALL
      ansible.builtin.shell: |
        ./{{ cryptcpbin }} -instcert -from_request {{ ansible_user_dir }}/{{ item }}.cer
      args:
        executable: /bin/bash
        chdir: "{{ cspbindir }}"
      loop:
        - "{{ crt_ca_natsclnt }}"
        - "{{ crt_ca_natssrv }}"
        - "{{ crt_ca_pkicaclnt }}"
        - "{{ crt_ca_caclnt }}"
