---
# handlers file for roles/19.config-distros-set-parameters-nats
- name: Force systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: "services registration"

- name: Restart services
  ansible.builtin.service:
    name: "{{ item.name }}"
    state: restarted
  loop:
    - { name: nats-streaming-server.service }
  listen: "services registration"
