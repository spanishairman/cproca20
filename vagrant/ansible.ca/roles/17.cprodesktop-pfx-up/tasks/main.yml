---
# tasks file for roles/17.cprodesktop-pfx-up
- name: UP
  ansible.builtin.copy:
    src: "{{ localdir }}/share/{{ item }}"
    dest: "{{ ansible_user_dir }}/{{ item }}"
  loop:
    - "{{ cacert }}.cer"
    - "{{ crt_opertls }}.pfx"
    - "{{ crt_opersign }}.pfx"

