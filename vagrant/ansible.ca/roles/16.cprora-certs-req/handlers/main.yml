---
# handlers file for roles/16.cprora-certs-req
- name: FETCH
  ansible.builtin.fetch:
    src: "{{ ansible_user_dir }}/{{ item.file }}.req"
    dest: "{{ localdir }}/share/"
    flat: 'true'
  loop:
    - { file: "{{ crt_ra_srv }}" }
    - { file: "{{ crt_ra_clnt }}" }
    - { file: "{{ crt_ra_webclnt }}" }
    - { file: "{{ crt_ra_pkicaclnt }}" }
    - { file: "{{ crt_opertls }}" }
    - { file: "{{ crt_opersign }}" }
